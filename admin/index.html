<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de Administración · JJ.VV. San Luis III</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f5f5; color: #24313b; }
    .topbar { background: #24313b; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .topbar .tag { background: #fa8072; color: #172027; padding: 4px 12px; border-radius: 999px; font-size: .75rem; font-weight: 800; }
    .topbar .hint { margin-left: auto; font-size: .82rem; color: #b9c5cb; }
    .intro { background: #fff9f6; border-bottom: 1px solid #eadfd9; padding: 12px 24px; font-size: .9rem; color: #52616b; }
    /* Punto de montaje del CMS. Decap lo detecta por ID y renderiza aqui,
       en lugar de tomar control de toda la pagina (bug removeChild). */
    #nc-root { min-height: calc(100vh - 90px); }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>JJ.VV. San Luis III</h1>
    <span class="tag">Panel de Administración</span>
    <span class="hint">Los cambios se publican en 1-2 minutos</span>
  </header>
  <div class="intro">
    Aquí puedes crear y editar <strong>eventos</strong> y la <strong>galería de imágenes</strong> del sitio web.
  </div>

  <div id="nc-root"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      CMS.init();
    });
  </script>
</body>
</html>
