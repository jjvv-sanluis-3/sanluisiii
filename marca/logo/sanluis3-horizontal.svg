<!--
  JJVV SAN LUIS III · Lockup horizontal (marca + nombre)
  Uso: encabezado de web, firmas de correo, planillas, certificados.
  Palabras: Inter 900 / 800 (fallback Segoe UI, Arial).
  Área de respeto = la altura de la cabeza central (8 unidades) a los 4 lados.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64"
     role="img" aria-label="Junta de Vecinos San Luis III">
  <title>JJVV San Luis III — logo horizontal</title>

  <!-- Marca -->
  <g fill="#fa8072">
    <circle cx="14" cy="26" r="6.5"/>
    <circle cx="50" cy="26" r="6.5"/>
    <circle cx="32" cy="20" r="8"/>
  </g>
  <path d="M8 38c4 11 13 16 24 16s20-5 24-16"
        fill="none" stroke="#fa8072" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Nombre -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <text x="84" y="28" font-size="21" font-weight="900" letter-spacing="0.5"
          fill="#24313b">JJ.VV. SAN LUIS III</text>
    <text x="85" y="47" font-size="10.5" font-weight="800" letter-spacing="2.2"
          fill="#52616b">JUNTA DE VECINOS · MAIPÚ</text>
  </g>
</svg>