        <path d="M188 124l7.4 5.3-2.8 8.9h-9.2l-2.8-8.9z"/>
        <path d="M159 159l7.4-4.3 2.8 8.9-7.4 5.3-7.4-5.3z"/>
        <path d="M179 159l7.4-4.3 2.8 8.9-7.4 5.3-7.4-5.3z"/>
      </g>
    </g>

    <!-- Aro del círculo, por encima de las pelotas: las contiene y
         evita que el detalle se coma el borde. -->
    <circle cx="150" cy="122" r="58" fill="none" stroke="#1e3036" stroke-width="7"/>

    <!-- Figura 1 · centro (salmón), la más grande -->
    <g fill="#fc6c5a">
