    <!-- Figura 2 · izquierda (tinta) -->
    <g fill="#1e3036">
      <circle cx="74" cy="92" r="16"/>
      <path d="M74 112c-5 0-9 3-11 8l-11-16a11 11 0 0 0-15 13l17 25
