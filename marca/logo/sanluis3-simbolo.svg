<!--
  JJVV SAN LUIS III · SÍMBOLO (sin texto)
  Generado por marca/tools/variantes.mjs. No editar a mano.

  USO: foto de perfil de redes, favicon grande, sello, marca de agua,
       ícono de app. En lugares donde no cabe el nombre completo.
  TAMAÑO MÍNIMO: 24 px en pantalla / 8 mm impreso.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 4 220 186" width="220" height="186"
     role="img" aria-label="Junta de Vecinos San Luis III">
  <title>JJVV San Luis III — símbolo</title>
  <g id="marca">

    <!-- Círculo blanco que aloja las pelotas -->
    <circle cx="150" cy="122" r="58" fill="#ffffff"/>

    <defs>
      <clipPath id="c-voley"><circle cx="150" cy="99" r="21"/></clipPath>
      <clipPath id="c-basket"><circle cx="131" cy="143" r="21"/></clipPath>
      <clipPath id="c-futbol"><circle cx="169" cy="143" r="21"/></clipPath>
    </defs>

    <!-- Vóleibol (arriba): costuras curvas que siguen la esfera.
         Se usaron arcos y no líneas rectas porque las rectas
         armaban una cuadrícula y se leía como ventana, no como balón. -->
    <g clip-path="url(#c-voley)">
      <circle cx="150" cy="99" r="21" fill="#ffffff" stroke="#1e3036" stroke-width="5"/>
      <g fill="none" stroke="#1e3036" stroke-width="3.5" stroke-linecap="round">
        <path d="M150 78c-7 9-7 33 0 42"/>
        <path d="M150 78c7 9 7 33 0 42"/>
        <path d="M129 91q21 11 42 0"/>
        <path d="M129 107q21-11 42 0"/>
      </g>
    </g>

    <!-- Básquetbol (abajo izquierda) -->
    <g clip-path="url(#c-basket)">
      <circle cx="131" cy="143" r="21" fill="#fc6c5a" stroke="#1e3036" stroke-width="5"/>
      <g fill="none" stroke="#1e3036" stroke-width="3.5" stroke-linecap="round">
        <path d="M110 143h42"/>
        <path d="M131 122v42"/>
        <path d="M114 129c11 9 23 9 34 0"/>
        <path d="M114 157c11-9 23-9 34 0"/>
      </g>
    </g>

    <!-- Fútbol (abajo derecha): pentágono central y cuatro parciales -->
    <g clip-path="url(#c-futbol)">
      <circle cx="169" cy="143" r="21" fill="#ffffff" stroke="#1e3036" stroke-width="5"/>
      <path d="M169 131.5l9.3 6.8-3.6 11h-11.4l-3.6-11z" fill="#1e3036"/>
      <g fill="#1e3036">
